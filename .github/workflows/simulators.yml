name: Make simulators
on:
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Install Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clone Epsilon
        run: |
          git clone https://github.com/numworks/epsilon epsilon_simulator -b version-20
          cd epsilon_simulator

      - name: Setup build environment
        run: build/setup.sh --only-simulator

      - name: Make simulator
        run: make PLATFORM=simulator epsilon.bin -j 8
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: epsilon_linux
          path: output/release/simulator/linux/epsilon.bin

  macos:
    runs-on: macOS-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Install Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clone Epsilon
        run: |
          git clone https://github.com/numworks/epsilon epsilon_simulator -b version-20
          cd epsilon_simulator

      - name: Setup build environment
        run: build/setup.sh --only-simulator

      - name: Make simulator
        run: make PLATFORM=simulator epsilon.app -j 8
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: epsilon_macos
          path: output/release/simulator/macos/epsilon.app
      