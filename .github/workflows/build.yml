name: Build
on: 
  pull_request:
    paths: src/**
  push:
    paths: src/**

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install C++ toolchain
        uses: numworks/setup-arm-toolchain@latest
      - name: Run make
        run: make
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nwa-files
          path: target/*nwa