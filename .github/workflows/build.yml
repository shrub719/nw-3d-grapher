name: Build
on: 
  pull_request:
    paths-ignore: 
      - '**.md'
      - 'LICENSE'
      - 'prototype/**'
  push:
    paths-ignore: 
      - '**.md'
      - 'LICENSE'
      - 'prototype/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: thumbv7em-none-eabihf
        
      - name: Build
        run: make
      - name: Upload build artifacts
        uses: actions-rs/cargo@v1
        with:
          command: build